<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Ordering</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding-bottom: 120px;
      color: #333;
    }

    h2 {
      text-align: center;
      padding: 15px;
      margin: 0;
      background: #007bff;
      color: white;
      font-size: 20px;
    }

    h3 {
      margin: 15px 5% 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #007bff;
      color: #007bff;
      font-size: 18px;
    }

    #search {
      width: 90%;
      margin: 10px auto;
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      position: sticky;
      top: 0;
      background: #f4f6f9;
      z-index: 100;
    }

    .menu-item {
      background: #fff;
      padding: 12px;
      margin: 8px auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      font-size: 15px;
    }

    .menu-item-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .menu-item button {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 14px;
    }

    .menu-item button:hover {
      background: #218838;
    }

    .menu-item input {
      width: 40px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px;
    }

    #cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #007bff;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
      z-index: 200;
    }

    #cart-bar div {
      display: flex;
      gap: 8px;
    }

    #cart-bar button {
      background: white;
      color: #007bff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    #cart-modal {
      display:none;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      background:#fff;
      padding:15px;
      border-radius:10px;
      box-shadow:0 6px 12px rgba(0,0,0,0.3);
      z-index:1000;
      width:90%;
      max-width:400px;
      animation: fadeIn 0.3s ease-in-out;
      font-size: 14px;
    }

    #cart-modal h3 {
      margin-top:0;
      color:#007bff;
      font-size: 16px;
    }

    #cart-modal button {
      margin-top: 12px;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      font-size: 14px;
    }

    #overlay {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      z-index:999;
    }

    @keyframes fadeIn {
      from {opacity:0; transform:translate(-50%, -60%);}
      to {opacity:1; transform:translate(-50%, -50%);}
    }

    #order-check {
      width: 90%;
      margin: 20px auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    #order-check input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #order-check button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    #loading {
      text-align:center;
      padding:20px;
      font-size:16px;
      color:#007bff;
    }
  </style>
</head>
<body>
  <h2>Restaurant Menu</h2>
  <input type="text" id="search" placeholder="Search menu..." onkeyup="renderMenu()">
  <div id="loading">Loading menu...</div>
  <div id="menu"></div>

  <!-- Fixed Cart Bar -->
  <div id="cart-bar">
    <span>Cart (<span id="cart-count">0</span>) | Total: Tsh <span id="total-bar">0</span></span>
    <div>
      <button onclick="viewDetails()">View Details</button>
      <button onclick="submitOrder()">Submit</button>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Cart Modal -->
  <div id="cart-modal">
    <h3>Cart Details</h3>
    <textarea id="order-notes" placeholder="Add notes/instructions..." style="width:100%;height:60px;margin-bottom:10px;"></textarea>
    <div id="cart-details"></div>
    <button onclick="closeModal()">Close</button>
  </div>

  <!-- Order Check Section -->
  <div id="order-check">
    <h3>Check Your Order</h3>
    <input type="text" id="order-id-input" placeholder="Enter your Order ID">
    <button onclick="checkOrder()">Get Bill</button>
    <div id="order-result"></div>
  </div>
  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwXN-Uw0QNbMVsq8J3NiZ57MNar1Cl7sJYPlNvDpTulRv3KKAIaThhG5BnuxxZdCUUHsw/exec"; // Replace with your Web App URL
    let menu = [];
    let cart = [];

    function formatCurrency(amount) {
      return amount.toLocaleString('en-US');
    }

    async function loadMenu() {
      document.getElementById("loading").style.display = "block";
      const res = await fetch(scriptURL);
      menu = await res.json();
      document.getElementById("loading").style.display = "none";
      renderMenu();
    }

    function renderMenu() {
      const search = document.getElementById("search").value.toLowerCase();
      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = "";

      const categories = [...new Set(menu.map(i => i.category))];
      categories.forEach(cat => {
        menuDiv.innerHTML += `<h3>${cat}</h3>`;
        menu.filter(item => item.category === cat && item.name.toLowerCase().includes(search))
            .forEach(item => {
              const existing = cart.find(i => i.name === item.name);
              const qty = existing ? existing.qty : 0;
              menuDiv.innerHTML += `
                <div class="menu-item">
                  ${item.name} - Tsh ${formatCurrency(item.price)}
                  <div class="menu-item-controls">
                    <button onclick="changeQty('${item.name}',-1,${item.price})">-</button>
                    <input type="number" min="0" value="${qty}" 
                      onchange="setQty('${item.name}', this.value, ${item.price})">
                    <button onclick="changeQty('${item.name}',1,${item.price})">+</button>
                  </div>
                </div>`;
            });
      });
    }

        function changeQty(name, delta, price) {
      let item = cart.find(i => i.name === name);
      if (!item && delta > 0) {
        cart.push({ name, price, qty: 1 });
      } else if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
      }
      renderCart();
      renderMenu();
    }

    function setQty(name, qty, price) {
      qty = parseInt(qty);
      let item = cart.find(i => i.name === name);
      if (qty > 0) {
        if (item) item.qty = qty;
        else cart.push({ name, price, qty });
      } else {
        cart = cart.filter(i => i.name !== name);
      }
      renderCart();
      renderMenu();
    }

    function renderCart() {
      let total = 0;
      let count = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        count += item.qty;
      });
      document.getElementById("total-bar").innerText = formatCurrency(total);
      document.getElementById("cart-count").innerText = count;
    }

    function viewDetails() {
      document.getElementById("cart-details").innerHTML = cart.map(i =>
        `<div class="menu-item">
          ${i.name} - Tsh ${formatCurrency(i.price)}
          <div class="menu-item-controls">
            <button onclick="changeQty('${i.name}',-1,${i.price})">-</button>
            <input type="number" min="0" value="${i.qty}" 
              onchange="setQty('${i.name}', this.value, ${i.price})">
            <button onclick="changeQty('${i.name}',1,${i.price})">+</button>
          </div>
        </div>`
      ).join("");
      document.getElementById("overlay").style.display = "block";
      document.getElementById("cart-modal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("cart-modal").style.display = "none";
    }
async function submitOrder() {
  if (cart.length === 0) {
    alert("Cart is empty!");
    return;
  }
  // Try query string first, then fallback to hash, then prompt
// Try query string first (works on custom domains)
// If empty, try hash (works on Google Sites)
// If still empty, ask user
let table = new URLSearchParams(window.location.search).get("table");
if (!table) {
  table = new URLSearchParams(window.location.hash.substring(1)).get("table");
}
table = table || prompt("Enter table number:");


  const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
  const notes = document.getElementById("order-notes").value || "";
// Get current time in HHMM format (24hr)
const now = new Date();
const hours = String(now.getHours()).padStart(2, '0');
const minutes = String(now.getMinutes()).padStart(2, '0');
const timeCode = hours + minutes;

// Build orderId as table + time
const orderId = table + "-" + timeCode;

  const orderData = { table, cart, total, notes, orderId };
  const res = await fetch(scriptURL, { method: "POST", body: JSON.stringify(orderData) });
  const result = await res.json();

  if (result.status === "success") {
    alert("✅ Order Complete! Your Order ID: " + orderId);
  } else {
    alert("❌ Error submitting order");
  }

  cart = [];
  renderCart();
  renderMenu();
  closeModal();
  document.getElementById("order-notes").value = "";
}


    async function checkOrder() {
      const orderId = document.getElementById("order-id-input").value.trim();
      if (!orderId) {
        alert("Please enter your Order ID");
        return;
      }
      const res = await fetch(scriptURL + "?orderId=" + orderId);
      const data = await res.json();
      if (data && data.total) {
        document.getElementById("order-result").innerHTML =
          "Order Total: Tsh " + formatCurrency(data.total) + "<br>Notes: " + (data.notes || "None");
      } else {
        document.getElementById("order-result").innerHTML = "Order not found.";
      }
    }

    loadMenu();
  </script>
</body>
</html>

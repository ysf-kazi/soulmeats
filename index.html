<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soulmeats Ordering</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .menu-item { display: flex; justify-content: space-between; margin: 10px 0; }
    .menu-item-controls button, .menu-item-controls input {
      height: 30px; vertical-align: middle;
    }
    #cart-modal {
      position: fixed; top: 10%; left: 10%; width: 80%; height: 80%;
      background: #fff; border: 1px solid #ccc; padding: 20px;
      overflow-y: auto; z-index: 1000;
    }
    #cart-details { margin-bottom: 10px; }
    #order-result { margin-top: 20px; }
  </style>
</head>
<body>

<h1>Welcome to Soulmeats</h1>
  <button onclick="openCheckOrder()">Check Order</button>
<div id="check-order-modal" style="display:none; position:fixed; top:20%; left:20%; width:60%; background:#fff; border:1px solid #ccc; padding:20px; z-index:2000;">
  <h2>Check Your Order</h2>
  <input type="text" id="check-order-id" placeholder="Enter Order ID" style="width:100%; margin-bottom:10px;">
  <button onclick="checkOrder(document.getElementById('check-order-id').value)">Get Bill</button>
  <button onclick="closeCheckOrder()">Close</button>
  <div id="order-result"></div>
</div>


<div id="menu"></div>
<div id="cart"></div>

<!-- Cart Modal -->
<div id="cart-modal" style="display:none;">
  <h2>Your Cart</h2>
  <div id="cart-details"></div>
  <div style="margin-top:10px;">
    <label>Notes:</label><br>
    <textarea id="order-notes" rows="3" style="width:100%;"></textarea>
  </div>
  <button onclick="submitOrder()" style="margin-top:10px;">Submit Order</button>
  <button onclick="closeCart()" style="margin-top:10px;">Back</button>
</div>

<div id="order-result"></div>

<script>
let cart = [];
const menu = [
  { name: "Chicken Wings", price: 5000 },
  { name: "Beef Burger", price: 8000 },
  { name: "Fries", price: 2000 }
];

// Get table number from URL
let table = new URLSearchParams(window.location.search).get("table") || prompt("Enter table number:");
table = "s" + table; // prefix with s
function openCheckOrder() {
  document.getElementById("check-order-modal").style.display = "block";
}

function closeCheckOrder() {
  document.getElementById("check-order-modal").style.display = "none";
}

  
function renderMenu() {
  document.getElementById("menu").innerHTML = menu.map(item => `
    <div class="menu-item">
      <span>${item.name} - Tsh ${item.price}</span>
      <div class="menu-item-controls">
        <button onclick="changeQty('${item.name}', -1, ${item.price})">-</button>
        <input type="text" value="${getQty(item.name)}" readonly style="width:30px;">
        <button onclick="changeQty('${item.name}', 1, ${item.price})">+</button>
      </div>
    </div>
  `).join("");
}

function getQty(name) {
  const item = cart.find(i => i.name === name);
  return item ? item.qty : 0;
}

function changeQty(name, delta, price) {
  let item = cart.find(i => i.name === name);
  if (!item && delta > 0) {
    cart.push({ name, price, qty: 1 });
  } else if (item) {
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
  }
  renderMenu();
  viewDetails(); // refresh cart modal too
}

function viewDetails() {
  document.getElementById("cart-modal").style.display = "block";
  document.getElementById("cart-details").innerHTML = cart.map(i =>
    `<div>${i.qty} x ${i.name} @ Tsh ${i.price}</div>`
  ).join("");
}

function closeCart() {
  document.getElementById("cart-modal").style.display = "none";
}

async function submitOrder() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const timeCode = hours + minutes;
  const orderId = table + "-" + timeCode;

  const order = {
    orderId,
    table,
    cart,
    total: cart.reduce((sum, i) => sum + i.qty * i.price, 0),
    notes: document.getElementById("order-notes").value
  };

  // Send to Google Apps Script endpoint
  const response = await fetch("https://script.google.com/macros/s/AKfycbwXN-Uw0QNbMVsq8J3NiZ57MNar1Cl7sJYPlNvDpTulRv3KKAIaThhG5BnuxxZdCUUHsw/exec", {
    method: "POST",
    body: JSON.stringify(order)
  });
  const result = await response.json();

  if (result.status === "success") {
    alert("✅ Order Complete! Your Order ID: " + orderId);
    navigator.clipboard.writeText(orderId);
    cart = [];
    renderMenu();
    closeCart();
  }
}

async function checkOrder(orderId) {
  const response = await fetch("https://script.google.com/macros/s/AKfycbwXN-Uw0QNbMVsq8J3NiZ57MNar1Cl7sJYPlNvDpTulRv3KKAIaThhG5BnuxxZdCUUHsw/exec?orderId=" + orderId);
  const data = await response.json();
  if (data && data.items) {
    const items = data.items.split('\n').join('<br>');
    document.getElementById("order-result").innerHTML =
      `<strong>Order ID:</strong> ${data.orderId}<br>
       <strong>Table:</strong> ${data.table}<br>
       <strong>Items:</strong><br>${items}<br>
       <strong>Total:</strong> Tsh ${data.total}<br>
       <strong>Notes:</strong> ${data.notes || "None"}<br><br>
       <strong>Lipa Number:</strong> 123456789`;
  }
}

renderMenu();
</script>

</body>
</html>

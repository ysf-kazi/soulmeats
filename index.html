<!DOCTYPE html>
<html>
<head>
  <title>Soulmeats Ordering</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; }
  h2 { margin-top:0; }
  .menu-item { padding:10px; border-bottom:1px solid #ddd; }
  .menu-item.unavailable { color:#999; }
  .menu-item-note { font-size:0.9em; color:red; }
  .menu-item-controls { margin-top:5px; }
  #cart-bar { position:fixed; bottom:0; left:0; right:0; background:#333; color:#fff; padding:10px; display:flex; justify-content:space-between; }
  #cart-modal, #overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; }
  #overlay { background:rgba(0,0,0,0.5); }
  #cart-modal { background:#fff; margin:auto; padding:20px; width:90%; max-width:400px; z-index:10; }
  #loading-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.8); align-items:center; justify-content:center; font-size:1.2em; }
  #loading-overlay.show { display:flex; }
</style>

</head>


<body>
  <h2>Menu</h2>
  <input id="search" placeholder="Search..." oninput="renderMenu()">
  <div id="menu"></div>

  <!-- Cart bar -->
  <div id="cart-bar">
    <span id="cart-count">0</span> items | Total: Tsh <span id="total-bar">0</span>
    <button onclick="viewDetails()">View Cart</button>
    <button onclick="callWaiter()">Call Waiter</button>
  </div>

  <!-- Cart modal -->
  <div id="overlay" onclick="closeModal()"></div>
  <div id="cart-modal">
    <h3>Your Cart</h3>
    <div id="cart-details"></div>
    <button onclick="closeModal()">Close</button>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">Loading...</div>

<script type="module">
  // Import Firebase SDKs
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc, addDoc } 
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCiQsHmUXjwQ4owvzdE36uxNV4KKuahrCQ",
    authDomain: "soulmeats-fbed1.firebaseapp.com",
    projectId: "soulmeats-fbed1",
    storageBucket: "soulmeats-fbed1.firebasestorage.app",
    messagingSenderId: "9679867484",
    appId: "1:9679867484:web:ac25df8aacab362c9fe099"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let menu = [];
  let cart = [];

  function formatCurrency(amount) {
    return amount.toLocaleString('en-US');
  }

  function isAvailableToday(item) {
    const today = new Date().toLocaleDateString('en-US', { weekday: 'short' });
    const allowed = item.availabilityDays || [];
    return allowed.includes(today) && !item.isDisabled;
  }

  async function loadMenu() {
    document.getElementById("loading-overlay").classList.add("show");
    const snapshot = await getDocs(collection(db, "menu"));
    menu = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    document.getElementById("loading-overlay").classList.remove("show");
    renderMenu();
  }

  function renderMenu() {
    const search = document.getElementById("search").value.toLowerCase();
    const menuDiv = document.getElementById("menu");
    menuDiv.innerHTML = "";

    const categories = [...new Set(menu.map(i => i.category))];
    categories.forEach(cat => {
      menuDiv.innerHTML += `<h3>${cat}</h3>`;
      menu.filter(item => item.category === cat && item.name.toLowerCase().includes(search))
          .forEach(item => {
            const available = isAvailableToday(item);
            const existing = cart.find(i => i.id === item.id);
            const qty = existing ? existing.qty : 0;
            menuDiv.innerHTML += `
              <div class="menu-item ${available ? "" : "unavailable"}">
                ${item.name} - Tsh ${formatCurrency(item.price)}
                ${available 
                  ? `<div class="menu-item-controls">
                       <button onclick="changeQty('${item.id}',-1,${item.price})">-</button>
                       <input type="number" min="0" value="${qty}" onchange="setQty('${item.id}', this.value, ${item.price})">
                       <button onclick="changeQty('${item.id}',1,${item.price})">+</button>
                     </div>`
                  : `<div class="menu-item-note">❌ Not available today</div>`}
              </div>`;
          });
    });
  }

  function changeQty(id, delta, price) {
    let item = cart.find(i => i.id === id);
    if (!item && delta > 0) {
      const menuItem = menu.find(m => m.id === id);
      cart.push({ id, name: menuItem.name, price, qty: 1 });
    } else if (item) {
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
    }
    renderCart();
    renderMenu();
  }

  function setQty(id, qty, price) {
    qty = parseInt(qty);
    let item = cart.find(i => i.id === id);
    if (qty > 0) {
      if (item) item.qty = qty;
      else {
        const menuItem = menu.find(m => m.id === id);
        cart.push({ id, name: menuItem.name, price, qty });
      }
    } else {
      cart = cart.filter(i => i.id !== id);
    }
    renderCart();
    renderMenu();
  }

  function renderCart() {
    let total = 0;
    let count = 0;
    cart.forEach(item => {
      total += item.price * item.qty;
      count += item.qty;
    });
    document.getElementById("total-bar").innerText = formatCurrency(total);
    document.getElementById("cart-count").innerText = count;
  }

  function viewDetails() {
    const itemsHtml = cart.map(i =>
      `<div>${i.qty} x ${i.name} - Tsh ${formatCurrency(i.price)}</div>`
    ).join("");
    const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    document.getElementById("cart-details").innerHTML =
      itemsHtml + `<div><strong>Total: Tsh ${formatCurrency(total)}</strong></div>
                   <button onclick="submitOrder()">Submit Order</button>`;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("cart-modal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("cart-modal").style.display = "none";
  }

  async function submitOrder() {
    if (cart.length === 0) { alert("Cart is empty!"); return; }
    document.getElementById("loading-overlay").classList.add("show");

    const table = prompt("Enter table number:");
    const orderId = table + "-" + Date.now();
    const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

    const orderData = { orderId, table, cart, total, notes:"", status:"pending", timestamp:new Date() };

    try {
      await setDoc(doc(db, "orders", orderId), orderData);
      alert("✅ Order Received! Your Order ID: " + orderId);
    } catch (err) {
      alert("❌ Error submitting order");
    } finally {
      document.getElementById("loading-overlay").classList.remove("show");
    }

    cart = [];
    renderCart();
    renderMenu();
    closeModal();
  }

  async function callWaiter() {
    const table = prompt("Enter table number:");
    document.getElementById("loading-overlay").classList.add("show");
    try {
      await addDoc(collection(db, "calls"), { table, status:"pending", timestamp:new Date() });
      alert("🚨 Waiter has been notified for Table " + table);
    } catch (err) {
      alert("❌ Error calling waiter");
    } finally {
      document.getElementById("loading-overlay").classList.remove("show");
    }
  }

  loadMenu();
</script>


</body>


</html>

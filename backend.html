<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soulmeats Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; }
  h2 { margin-top:0; }
  .container { display:flex; height:100vh; }
  .section { flex:1; padding:20px; overflow-y:auto; }
  .section.orders { border-right:2px solid #ccc; }
  .card { padding:10px; margin-bottom:10px; border:1px solid #ddd; background:#f9f9f9; }
  .card.unhandled { background:#ffe; }
  .menu-item { padding:10px; border-bottom:1px solid #ddd; }
  .menu-item.unavailable { color:#999; }
  .menu-item-note { font-size:0.9em; color:red; }
  button { margin-top:5px; }
  .admin-form { margin-top:20px; border-top:2px solid #ccc; padding-top:10px; }
  .days { display:flex; gap:5px; margin-top:5px; }
  .days label { font-size:0.9em; }
</style>

</head>
<body>
  <!-- Dashboard -->
  <div class="container">
    <div class="section orders">
      <h2>Orders Received</h2>
      <div id="orders-list"></div>
    </div>
    <div class="section calls">
      <h2>Waiter Calls</h2>
      <div id="calls-list"></div>
    </div>
  </div>

  <!-- Admin Menu Management -->
  <div class="admin-form">
    <h2>Manage Menu Item</h2>
    <input id="item-name" placeholder="Item Name"><br>
    <input id="item-price" type="number" placeholder="Price"><br>
    <input id="item-category" placeholder="Category"><br>
    <div class="days">
      <label><input type="checkbox" value="Mon">Mon</label>
      <label><input type="checkbox" value="Tue">Tue</label>
      <label><input type="checkbox" value="Wed">Wed</label>
      <label><input type="checkbox" value="Thu">Thu</label>
      <label><input type="checkbox" value="Fri">Fri</label>
      <label><input type="checkbox" value="Sat">Sat</label>
      <label><input type="checkbox" value="Sun">Sun</label>
    </div>
    <label><input type="checkbox" id="item-disabled"> Disable Item</label><br>
    <button onclick="saveMenuItem()">Save Item</button>
  </div>

  <!-- Audio notifications -->
  <audio id="order-sound" src="order-tone.mp3"></audio>
  <audio id="call-sound" src="buzz-tone.mp3"></audio>

  <script>
  // Firebase init
  const firebaseConfig = { /* your config */ };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Dashboard listeners
  db.collection("orders").where("status","==","pending")
    .onSnapshot(snapshot => {
      const list = document.getElementById("orders-list");
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const order = doc.data();
        list.innerHTML += `
          <div class="card unhandled">
            <strong>${order.orderId}</strong> (Table ${order.table})<br>
            Total: ${order.total}<br>
            <button onclick="viewOrder('${doc.id}')">View</button>
            <button onclick="handleOrder('${doc.id}')">Mark Handled</button>
          </div>`;
      });
      if (!snapshot.empty) document.getElementById("order-sound").play();
    });

  db.collection("calls").where("status","==","pending")
    .onSnapshot(snapshot => {
      const list = document.getElementById("calls-list");
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const call = doc.data();
        list.innerHTML += `
          <div class="card unhandled">
            Table ${call.table} called at ${new Date(call.timestamp.seconds*1000).toLocaleTimeString()}<br>
            <button onclick="handleCall('${doc.id}')">Mark Handled</button>
          </div>`;
      });
      if (!snapshot.empty) document.getElementById("call-sound").play();
    });

  async function viewOrder(id) {
    const doc = await db.collection("orders").doc(id).get();
    const order = doc.data();
    alert(`Order ${order.orderId}\nTable: ${order.table}\nItems:\n${order.cart.map(i=>i.qty+" x "+i.name).join("\n")}\nTotal: ${order.total}\nNotes: ${order.notes}`);
  }

  async function handleOrder(id) {
    await db.collection("orders").doc(id).update({ status:"handled" });
  }
  async function handleCall(id) {
    await db.collection("calls").doc(id).update({ status:"handled" });
  }

  // Admin menu management
  async function saveMenuItem() {
    const name = document.getElementById("item-name").value;
    const price = parseFloat(document.getElementById("item-price").value);
    const category = document.getElementById("item-category").value;
    const days = Array.from(document.querySelectorAll(".days input:checked")).map(cb => cb.value);
    const disabled = document.getElementById("item-disabled").checked;

    await db.collection("menu").doc(name).set({
      name, price, category,
      availabilityDays: days,
      isDisabled: disabled
    }, { merge:true });

    alert("✅ Menu item saved/updated");
  }
</script>

</body>

</html>
